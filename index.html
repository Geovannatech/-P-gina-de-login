<body>

<div class="senha-container">

    <input

        id="senha"
        placeholder="Digite sua senha"
    >

    <button type="button" id="mostrarSenha">
        👁
    </button>

</div>

<a href="#" class="esqueceu">
    Esqueceu sua senha?

    Não tem uma conta?

</p>
</a>
            <button>Entrar</button>

        </div>

    </div>

<script src="script.js"></script>

</body>

</html>
